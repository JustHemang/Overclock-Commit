<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Profile - IRCTC</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="assets/new_ui.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    .page-hero {
      text-align: center;
      padding: 36px 20px 28px;
    }
    .page-hero h1 {
      font-size: 28px;
      font-weight: 900;
      color: var(--primary);
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }
    .page-hero .mono {
      font-family: 'Courier New', Courier, monospace;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    .page-hero p {
      color: var(--text-secondary);
      font-size: 13px;
    }
    .wrap {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 20px;
    }
    .profile-layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 20px;
      align-items: start;
    }
    .profile-card {
      background: var(--bg-card);
      border-radius: var(--radius-xl);
      border: 1px solid var(--border);
      padding: 28px 22px;
      box-shadow: var(--shadow-sm);
      text-align: center;
    }
    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      margin: 0 auto 14px;
      background: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 28px;
      font-weight: 800;
      text-transform: uppercase;
    }
    .profile-card h2 {
      font-size: 18px;
      font-weight: 800;
      color: var(--text-body);
      margin-bottom: 4px;
    }
    .profile-card .phone-display {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }
    .profile-meta {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      text-align: left;
    }
    .profile-meta-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-secondary);
    }
    .profile-meta-item svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      color: var(--text-muted);
    }
    .profile-meta-item strong {
      color: var(--text-body);
      font-weight: 600;
    }
    .checkout-section {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: var(--shadow-sm);
    }
    .checkout-section h3 {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-body);
    }
    .checkout-section h3 svg {
      width: 16px;
      height: 16px;
      color: var(--primary);
    }
    .section-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 12px;
    }
    .btn-edit {
      padding: 9px 18px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 700;
      background: var(--bg-alt);
      color: var(--text-body);
      border: 1px solid var(--border);
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-edit:hover {
      border-color: var(--primary);
      color: var(--primary);
    }
    .btn-edit.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .stats-grid .stat-item {
      padding: 14px;
    }
    .btn-logout {
      width: 100%;
      padding: 11px 18px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 700;
      background: var(--danger-bg);
      color: var(--danger);
      border: 1px solid rgba(220, 38, 38, 0.15);
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-logout:hover {
      background: var(--danger);
      color: #fff;
    }
    @media (max-width: 768px) {
      .profile-layout {
        grid-template-columns: 1fr;
      }
      .stats-grid {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
</head>
<body>
  <header class="header" id="mainHeader"></header>
  <div class="mobile-nav" id="mobileNav"></div>
  <main class="main">
    <div class="page-container">
      <div class="page-hero">
        <h1 class="page-title">MY PROFILE</h1>
        <p class="page-subtitle">Manage your account settings</p>
      </div>
      <div class="content-section">
        <div class="wrap">
          <div class="profile-layout">
            <div class="profile-card">
              <div class="avatar" id="profileAvatar">U</div>
              <h2 id="profileDisplayName">-</h2>
              <p class="phone-display" id="profileDisplayPhone">-</p>
              <div class="profile-meta">
                <div class="profile-meta-item">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="4" width="20" height="16" rx="2" />
                    <path d="M22 7l-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
                  </svg>
                  <span id="metaEmail">-</span>
                </div>
                <div class="profile-meta-item">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                    <circle cx="12" cy="7" r="4" />
                  </svg>
                  <span id="metaUsername">@user</span>
                </div>
                <div class="profile-meta-item">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
                    <line x1="16" y1="2" x2="16" y2="6" />
                    <line x1="8" y1="2" x2="8" y2="6" />
                    <line x1="3" y1="10" x2="21" y2="10" />
                  </svg>
                  <span>Member since <strong id="metaJoined">2026</strong></span>
                </div>
              </div>
            </div>
            <div class="right-column">
              <div class="checkout-section">
                <h3>
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                    <circle cx="12" cy="7" r="4" />
                  </svg>
                  Personal Information
                </h3>
                <form id="profileForm" onsubmit="return false;">
                  <div class="form-group" style="margin-bottom:10px;">
                    <label>Full Name</label>
                    <div class="input-wrapper">
                      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                        <circle cx="12" cy="7" r="4" />
                      </svg>
                      <input type="text" id="profileName" placeholder="Your name" disabled>
                    </div>
                  </div>
                  <div class="form-group" style="margin-bottom:10px;">
                    <label>Phone</label>
                    <div class="input-wrapper">
                      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path
                          d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z" />
                      </svg>
                      <input type="tel" id="profilePhone" placeholder="10-digit mobile number" maxlength="10" disabled>
                    </div>
                  </div>
                  <div class="form-group" style="margin-bottom:10px;">
                    <label>Email</label>
                    <div class="input-wrapper">
                      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="4" width="20" height="16" rx="2" />
                        <path d="M22 7l-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
                      </svg>
                      <input type="email" id="profileEmail" placeholder="your@email.com" disabled>
                    </div>
                  </div>
                  <div class="section-actions">
                    <button type="button" class="btn-edit" id="editToggleBtn" onclick="toggleEdit()">
                      <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z" />
                      </svg>
                      Edit
                    </button>
                    <button type="button" class="btn-search" id="saveBtn" style="display:none;" onclick="saveProfile()">
                      <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" />
                        <polyline points="17 21 17 13 7 13 7 21" />
                        <polyline points="7 3 7 8 15 8" />
                      </svg>
                      Save Changes
                    </button>
                  </div>
                </form>
              </div>
              <div class="checkout-section">
                <h3>
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                    <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                  </svg>
                  Security
                </h3>
                <div class="form-group" style="margin-bottom:10px;">
                  <label>Current Password</label>
                  <div class="input-wrapper">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path
                        d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4" />
                    </svg>
                    <input type="password" id="currentPass" placeholder="Enter current password">
                  </div>
                </div>
                <div class="form-group" style="margin-bottom:10px;">
                  <label>New Password</label>
                  <div class="input-wrapper">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                      <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                    </svg>
                    <input type="password" id="newPass" placeholder="Min 4 characters">
                  </div>
                </div>
                <div class="form-group" style="margin-bottom:10px;">
                  <label>Confirm New Password</label>
                  <div class="input-wrapper">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                      <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                    </svg>
                    <input type="password" id="confirmPass" placeholder="Re-enter new password">
                  </div>
                </div>
                <div class="section-actions">
                  <button type="button" class="btn-search" onclick="changePassword()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none"
                      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path
                        d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4" />
                    </svg>
                    Change Password
                  </button>
                </div>
              </div>
              <div class="checkout-section">
                <h3>
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 20V10" />
                    <path d="M12 20V4" />
                    <path d="M6 20v-6" />
                  </svg>
                  Account Stats
                </h3>
                <div class="stats-grid">
                  <div class="stat-item">
                    <div class="stat-number" id="statTotalTrips">0</div>
                    <div class="stat-label">Total Trips</div>
                  </div>
                  <div class="stat-item">
                    <div class="stat-number" id="statUpcoming">0</div>
                    <div class="stat-label">Upcoming</div>
                  </div>
                  <div class="stat-item">
                    <div class="stat-number" id="statCompleted">0</div>
                    <div class="stat-label">Completed</div>
                  </div>
                  <div class="stat-item">
                    <div class="stat-number" id="statSaved">₹0</div>
                    <div class="stat-label">Saved</div>
                  </div>
                </div>
              </div>
              <div class="checkout-section">
                <h3>
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path
                      d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                  Actions
                </h3>
                <button type="button" class="btn-logout" onclick="handleLogout()">
                  <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                    <polyline points="16 17 21 12 16 7" />
                    <line x1="21" y1="12" x2="9" y2="12" />
                  </svg>
                  Logout
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
  <footer class="footer" id="mainFooter"></footer>
  <div class="toast-container" id="toastContainer"></div>
  <script src="data.js"></script>
  <script src="common.js"></script>
  <script src="api.js"></script>
  <script>
    let isEditing = false;
    function toggleEdit() {
      isEditing = !isEditing;
      const fields = ['profileName', 'profilePhone', 'profileEmail'];
      fields.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.disabled = !isEditing;
      });
      const editBtn = document.getElementById('editToggleBtn');
      const saveBtn = document.getElementById('saveBtn');
      if (isEditing) {
        editBtn.style.display = 'none';
        saveBtn.style.display = 'inline-flex';
        document.getElementById('profileName').focus();
      } else {
        editBtn.style.display = 'inline-flex';
        saveBtn.style.display = 'none';
      }
    }
    function loadProfile() {
      const user = getCurrentUser();
      if (!user) return;
      const displayName = user.name || user.username || 'User';
      const initial = displayName[0].toUpperCase();
      document.getElementById('profileAvatar').textContent = initial;
      document.getElementById('profileDisplayName').textContent = displayName;
      document.getElementById('profileDisplayPhone').textContent = user.phone || 'No phone set';
      document.getElementById('metaEmail').textContent = user.email || 'No email set';
      document.getElementById('metaUsername').textContent = '@' + (user.username || 'user');
      document.getElementById('metaJoined').textContent = user.joined || '2026';
      document.getElementById('profileName').value = user.name || '';
      document.getElementById('profilePhone').value = user.phone || '';
      document.getElementById('profileEmail').value = user.email || '';
    }
    function saveProfile() {
      const name = document.getElementById('profileName').value.trim();
      const email = document.getElementById('profileEmail').value.trim();
      const phone = document.getElementById('profilePhone').value.trim();
      if (!name) { showToast('Name cannot be empty', 'error'); return; }
      const user = getCurrentUser();
      user.name = name;
      user.email = email;
      user.phone = phone;
      setCurrentUser(user);
      const displayName = name || user.username || 'User';
      document.getElementById('profileDisplayName').textContent = displayName;
      document.getElementById('profileAvatar').textContent = displayName[0].toUpperCase();
      document.getElementById('profileDisplayPhone').textContent = phone || 'No phone set';
      document.getElementById('metaEmail').textContent = email || 'No email set';
      updateAuthUI();
      toggleEdit();
      showToast('Profile updated successfully!', 'success');
    }
    async function changePassword() {
      const current = document.getElementById('currentPass').value;
      const newPass = document.getElementById('newPass').value;
      const confirm = document.getElementById('confirmPass').value;
      if (!current || !newPass || !confirm) { showToast('Fill in all password fields', 'error'); return; }
      if (newPass.length < 4) { showToast('New password must be at least 4 characters', 'error'); return; }
      if (newPass !== confirm) { showToast('New passwords do not match', 'error'); return; }
      const result = await apiFetch('/api/auth/change-password', {
        method: 'POST',
        body: JSON.stringify({ currentPassword: current, newPassword: newPass })
      });
      if (!result.success) {
        showToast(result.error || 'Failed to change password', 'error');
        return;
      }
      showToast('Password changed successfully!', 'success');
      document.getElementById('currentPass').value = '';
      document.getElementById('newPass').value = '';
      document.getElementById('confirmPass').value = '';
    }
    function handleLogout() {
      if (confirm('Are you sure you want to logout?')) logout();
    }
    async function renderStats() {
      const result = await getMyBookings();
      if (!result.success) return;
      const bookings = result.bookings || [];
      const now = new Date();
      const upcoming = bookings.filter(b => new Date(b.date) >= now && b.status !== 'cancelled').length;
      const completed = bookings.filter(b => new Date(b.date) < now || b.status === 'confirmed').length;
      const totalSaved = bookings.reduce((sum, b) => sum + Math.round((b.fare || 0) * 0.08), 0);
      document.getElementById('statTotalTrips').textContent = bookings.length;
      document.getElementById('statUpcoming').textContent = upcoming;
      document.getElementById('statCompleted').textContent = completed;
      document.getElementById('statSaved').textContent = formatCurrency(totalSaved);
    }
    document.addEventListener('DOMContentLoaded', () => {
      if (!requireLogin()) return;
      loadProfile();
      renderStats();
      animatePageIn();
    });
  </script>
</body>
</html>
