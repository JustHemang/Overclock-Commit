<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>PNR Status - IRCTC</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="assets/new_ui.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    .mono {
      font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', Consolas, monospace;
    }
    .pnr-hero {
      background: var(--primary);
      padding: 48px 20px 56px;
      text-align: center;
      position: relative;
      overflow: hidden;
      margin-top: var(--header-h);
    }
    .pnr-hero::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(0, 0, 117, 0.95), rgba(0, 0, 92, 0.85));
      pointer-events: none;
    }
    .pnr-hero>* {
      position: relative;
      z-index: 2;
    }
    .pnr-hero h1 {
      font-size: 32px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 6px;
      letter-spacing: 3px;
    }
    .pnr-hero p {
      color: rgba(255, 255, 255, 0.6);
      font-size: 13px;
      margin-bottom: 0;
    }
    .pnr-search-card {
      background: var(--bg-card);
      border-radius: var(--radius-xl);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-lg);
      max-width: 560px;
      margin: -32px auto 0;
      position: relative;
      z-index: 3;
      padding: 28px 24px 24px;
      text-align: center;
    }
    .pnr-search-card .card-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(0, 0, 117, 0.06);
      margin-bottom: 12px;
    }
    .pnr-search-card .card-icon svg {
      color: var(--primary);
    }
    .pnr-search-card h2 {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-body);
      margin-bottom: 4px;
    }
    .pnr-search-card>p {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 16px;
    }
    .pnr-search-card .input-wrapper {
      max-width: 100%;
    }
    .pnr-search-card .input-wrapper input {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--primary);
    }
    .pnr-search-card .input-wrapper input::placeholder {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0;
      color: var(--text-muted);
    }
    .pnr-search-card .input-wrapper svg {
      color: var(--text-muted);
      flex-shrink: 0;
    }
    .search-btn {
      width: 100%;
      margin-top: 12px;
      padding: 12px 24px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 700;
      background: var(--accent);
      color: #fff;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: var(--transition);
    }
    .search-btn:hover {
      background: var(--accent-dark);
    }
    .hint {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 10px;
    }
    .pnr-results {
      max-width: 720px;
      margin: 24px auto 0;
      display: none;
      padding: 0 20px;
    }
    .pnr-results.show {
      display: block;
    }
    .pnr-result-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      overflow: hidden;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
    }
    .pnr-result-header {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-light);
      flex-wrap: wrap;
      gap: 10px;
    }
    .pnr-result-header h3 {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-body);
      margin: 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .pnr-result-header h3 svg {
      color: var(--primary);
    }
    .pnr-number-display {
      font-size: 11px;
      font-weight: 600;
      color: var(--primary);
      background: rgba(0, 0, 117, 0.05);
      padding: 4px 10px;
      border-radius: 50px;
      letter-spacing: 1px;
    }
    .pnr-journey-info {
      padding: 18px 20px;
    }
    .pnr-train-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border-light);
    }
    .pnr-train-icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: rgba(0, 0, 117, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--primary);
    }
    .pnr-train-details {
      flex: 1;
    }
    .pnr-train-details .name {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-body);
    }
    .pnr-train-details .number {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 1px;
    }
    .pnr-route-display {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .pnr-route-station {
      text-align: center;
      flex-shrink: 0;
    }
    .pnr-route-station .code {
      font-weight: 800;
      font-size: 18px;
      color: var(--text-body);
      display: block;
    }
    .pnr-route-station .name {
      font-size: 10px;
      color: var(--text-muted);
      display: block;
      margin-top: 1px;
    }
    .pnr-route-station .time {
      font-size: 12px;
      color: var(--primary);
      font-weight: 600;
      display: block;
    }
    .pnr-route-line {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }
    .pnr-route-line .date {
      font-size: 10px;
      color: var(--text-muted);
      font-weight: 500;
    }
    .pnr-route-line .line {
      width: 100%;
      height: 2px;
      background: var(--border);
      border-radius: 1px;
      position: relative;
    }
    .pnr-route-line .line::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--primary);
    }
    .pnr-route-line .line::after {
      content: '';
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
    }
    .pnr-route-line .class-info {
      font-size: 10px;
      color: var(--text-secondary);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .pnr-route-line .class-info svg {
      width: 10px;
      height: 10px;
    }
    .pnr-chart-status {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 14px;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      font-size: 11px;
      font-weight: 600;
    }
    .pnr-chart-status.prepared {
      background: var(--success-bg);
      color: var(--success);
    }
    .pnr-chart-status.not-prepared {
      background: var(--warning-bg);
      color: var(--warning);
    }
    .pnr-chart-status svg {
      width: 14px;
      height: 14px;
    }
    .pnr-passengers {
      padding: 0 20px 18px;
    }
    .pnr-passengers h4 {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .pnr-passengers h4 svg {
      width: 12px;
      height: 12px;
    }
    .pnr-passenger-table {
      width: 100%;
      border-collapse: collapse;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .pnr-passenger-table th {
      padding: 9px 12px;
      text-align: left;
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: var(--bg-alt);
      border-bottom: 1px solid var(--border);
    }
    .pnr-passenger-table td {
      padding: 10px 12px;
      font-size: 12px;
      border-bottom: 1px solid var(--border-light);
      color: var(--text-body);
    }
    .pnr-passenger-table tr:last-child td {
      border-bottom: none;
    }
    .pnr-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: 50px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .pnr-status-badge.confirmed {
      background: var(--success-bg);
      color: var(--success);
    }
    .pnr-status-badge.rac {
      background: var(--warning-bg);
      color: var(--warning);
    }
    .pnr-status-badge.waitlist {
      background: var(--danger-bg);
      color: var(--danger);
    }
    .pnr-status-badge.can {
      background: rgba(100, 116, 139, 0.1);
      color: #64748b;
    }
    .pnr-status-badge.cnf {
      background: var(--success-bg);
      color: var(--success);
    }
    .pnr-result-actions {
      padding: 14px 20px;
      border-top: 1px solid var(--border-light);
      display: flex;
      gap: 8px;
      justify-content: center;
    }
    .pnr-result-actions button,
    .pnr-result-actions a {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .pnr-loading {
      display: none;
      text-align: center;
      padding: 48px 20px;
    }
    .pnr-loading.show {
      display: block;
    }
    .pnr-loading-train {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .pnr-loading-train .train-icon {
      color: var(--primary);
      animation: pnrTrainBounce 1s ease-in-out infinite;
    }
    .pnr-loading-train .track {
      width: 120px;
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }
    .pnr-loading-train .track::after {
      content: '';
      position: absolute;
      top: 0;
      left: -50%;
      width: 50%;
      height: 100%;
      background: linear-gradient(90deg, transparent, var(--primary), transparent);
      border-radius: 2px;
      animation: pnrTrackMove 1.2s ease-in-out infinite;
    }
    @keyframes pnrTrainBounce {
      0%,
      100% {
        transform: translateX(0);
      }
      50% {
        transform: translateX(16px);
      }
    }
    @keyframes pnrTrackMove {
      0% {
        left: -50%;
      }
      100% {
        left: 100%;
      }
    }
    .pnr-loading p {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
    }
    .pnr-loading .dots::after {
      content: '';
      animation: dots 1.4s steps(4, end) infinite;
    }
    @keyframes dots {
      0% {
        content: '';
      }
      25% {
        content: '.';
      }
      50% {
        content: '..';
      }
      75% {
        content: '...';
      }
      100% {
        content: '';
      }
    }
    .pnr-reveal {
      animation: pnrReveal 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes pnrReveal {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    .pnr-reveal-delay-1 {
      animation-delay: 0.1s;
    }
    .pnr-reveal-delay-2 {
      animation-delay: 0.2s;
    }
    @media (max-width: 600px) {
      .pnr-hero h1 {
        font-size: 24px;
      }
      .pnr-search-card {
        margin: -24px 12px 0;
        padding: 20px 16px 16px;
      }
      .pnr-route-display {
        flex-direction: column;
        gap: 6px;
      }
      .pnr-route-line .line {
        width: 2px;
        height: 20px;
      }
      .pnr-route-line .line::before {
        left: 50%;
        top: 0;
        transform: translateX(-50%);
      }
      .pnr-route-line .line::after {
        right: auto;
        left: 50%;
        bottom: 0;
        top: auto;
        transform: translateX(-50%);
      }
      .pnr-passenger-table {
        font-size: 11px;
      }
      .pnr-passenger-table th,
      .pnr-passenger-table td {
        padding: 7px 8px;
      }
      .pnr-result-actions {
        flex-direction: column;
      }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
</head>
<body>
  <header class="header" id="mainHeader"></header>
  <div class="mobile-nav" id="mobileNav"></div>
  <main class="main">
    <div class="page-container-new">
      <div class="page-card" style="text-align: center;">
        <h1 class="page-title">PNR STATUS</h1>
        <p class="page-subtitle">Check your booking status in real-time</p>
        
        <div class="pnr-search-card" style="box-shadow: none; border: none; background: transparent; padding: 0;">
          <div class="card-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z" />
              <path d="M13 5v2" />
              <path d="M13 17v2" />
              <path d="M13 11v2" />
            </svg>
          </div>
          <h2>Enter PNR Number</h2>
          <p>Enter your 10-digit PNR number to check current booking status</p>
          <div class="input-wrapper" style="margin: 0 auto 20px; max-width: 300px;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="4" y1="9" x2="20" y2="9" />
              <line x1="4" y1="15" x2="20" y2="15" />
              <line x1="10" y1="3" x2="8" y2="21" />
              <line x1="16" y1="3" x2="14" y2="21" />
            </svg>
            <input type="text" id="pnrInput" placeholder="Enter 10-digit PNR number" maxlength="13" autocomplete="off" inputmode="numeric" oninput="formatPNRInput(this)" onkeydown="if(event.key==='Enter'){event.preventDefault();checkPNR();}" style="background:transparent; border:none; color:var(--dark-blue); font-weight:bold;">
          </div>
          <button class="search-btn" id="checkPnrBtn" onclick="checkPNR()" style="background:var(--primary-orange); border-radius:15px; border:none; color:white; padding:15px 30px; font-weight:bold; cursor:pointer;">
            Check Status
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
          </button>
          <p class="hint" style="margin-top:15px; color:var(--text-muted);">Format: 10-digit number (e.g. 2124567890)</p>
        </div>
    <div class="pnr-loading" id="pnrLoading">
      <div class="pnr-loading-train">
        <div class="train-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="3" width="16" height="14" rx="2" />
            <path d="M4 11h16" />
            <path d="M12 3v8" />
            <path d="M8 19l-2 3" />
            <path d="M16 19l2 3" />
            <circle cx="8" cy="15" r="1" />
            <circle cx="16" cy="15" r="1" />
          </svg>
        </div>
        <div class="track"></div>
      </div>
      <p>Fetching status<span class="dots"></span></p>
    </div>
    <div class="pnr-results" id="pnrResults"></div>
      </div> <!-- End page-card -->
    </div> <!-- End page-container-new -->
  </main>
  <footer class="footer" id="mainFooter"></footer>
  <div class="toast-container" id="toastContainer"></div>
  <script src="data.js"></script>
  <script src="common.js"></script>
  <script src="api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const urlPnr = params.get('pnr') || params.get('pnr_number');
      if (urlPnr) {
        document.getElementById('pnrInput').value = urlPnr;
        formatPNRInput(document.getElementById('pnrInput'));
        checkPNR();
      }
    });

    function formatPNRInput(input) {
      let v = input.value.replace(/\D/g, '').substring(0, 11);
      let formatted = '';
      if (v.length > 0) formatted += v.substring(0, 4);
      if (v.length > 4) formatted += ' ' + v.substring(4, 8);
      if (v.length > 8) formatted += ' ' + v.substring(8);
      input.value = formatted;
    }
    function getCleanPNR() {
      return document.getElementById('pnrInput').value.replace(/\D/g, '');
    }
    function checkPNR() {
      const raw = getCleanPNR();
      if (raw.length < 10 || raw.length > 11) {
        showToast('Please enter a valid 10-digit PNR number', 'error');
        return;
      }
      const resultsEl = document.getElementById('pnrResults');
      const loadingEl = document.getElementById('pnrLoading');
      resultsEl.classList.remove('show');
      resultsEl.innerHTML = '';
      loadingEl.classList.add('show');
      fetchPNRFromAPI(raw);
    }
    async function fetchPNRFromAPI(pnr) {
      try {
        const result = await apiFetch('/api/pnr/' + pnr);
        const loadingEl = document.getElementById('pnrLoading');
        if (result && result.success && result.data) {
          loadingEl.classList.remove('show');
          renderPNRResult(pnr, result.data);
          return;
        }
      } catch (e) {}
      const booking = findBookingByPNR(pnr);
      if (booking) {
        document.getElementById('pnrLoading').classList.remove('show');
        renderLocalBookingPNR(pnr, booking);
        return;
      }
      document.getElementById('pnrLoading').classList.remove('show');
      document.getElementById('pnrResults').innerHTML =
        '<div class="pnr-result-card pnr-reveal" style="text-align:center;padding:48px 24px;">' +
        '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:16px;">' +
        '<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>' +
        '<h3 style="margin:0 0 8px;font-size:16px;">PNR Not Found</h3>' +
        '<p style="margin:0;font-size:13px;color:var(--text-muted);">No booking found with PNR ' + pnr + '. Please check the PNR number and try again.</p>' +
        '</div>';
      document.getElementById('pnrResults').classList.add('show');
    }
    function renderLocalBookingPNR(pnr, booking) {
      const findS = c => { const s = STATIONS.find(x => x.code === c); return s ? s.name : c; };
      const berths = ['LB', 'MB', 'UB', 'SL', 'SU'];
      const paxData = (booking.passengers || []).map((p, i) => {
        const seatNum = Math.floor(Math.random() * 64) + 1;
        const coachPre = { '1A': 'H', '2A': 'A', '3A': 'B', 'SL': 'S', '2S': 'D', 'CC': 'C' }[booking.classType] || 'B';
        const coachNum = Math.floor(Math.random() * 8) + 3;
        const berthType = berths[i % berths.length];
        return {
          name: p.name || 'Passenger ' + (i + 1),
          age: p.age || 25,
          gender: p.gender || 'M',
          bookingStatus: booking.classType + '/' + seatNum + '/' + coachPre + String(coachNum).padStart(2, '0') + '/CNF',
          currentStatus: booking.status === 'cancelled' ? 'CAN' : 'CNF',
          coach: coachPre + String(coachNum).padStart(2, '0'),
          berth: seatNum + '/' + berthType,
        };
      });
      renderPNRResult(pnr, {
        train: booking.train,
        from: { code: booking.from, name: findS(booking.from) },
        to: { code: booking.to, name: findS(booking.to) },
        date: booking.date,
        classType: booking.classType,
        quota: booking.quota || 'GN',
        chartPrepared: true,
        chartStatus: 'CHART PREPARED',
        passengers: paxData,
      });
    }
    function findBookingByPNR(pnr) {
      try {
        const bookings = JSON.parse(localStorage.getItem('irctc_bookings') || '[]');
        return bookings.find(b => {
          const clean = (b.pnr || '').replace(/\D/g, '');
          return clean === pnr;
        });
      } catch (e) { return null; }
    }
    function renderPNRResult(pnr, data) {
      const container = document.getElementById('pnrResults');
      const fromCode = data.from.code;
      const toCode = data.to.code;
      const journeyDate = data.date;
      const chartBadge = data.chartPrepared
        ? '<div class="pnr-chart-status prepared"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg> Chart has been prepared</div>'
        : '<div class="pnr-chart-status not-prepared"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> Chart not yet prepared</div>';
      const paxRows = data.passengers.map((p, i) => {
        const st = (p.currentStatus || 'CNF').toLowerCase();
        const badgeClass = st === 'cnf' ? 'confirmed' : st === 'rac' || st.includes('rac') ? 'rac' : st === 'wl' || st.includes('wl') ? 'waitlist' : st === 'can' ? 'can' : 'confirmed';
        const statusLabel = p.currentStatus === 'CNF' ? 'CONFIRMED' : p.currentStatus;
        const nameDisplay = p.name || ('Passenger ' + (i + 1));
        const detailDisplay = (p.age && p.gender && p.age !== '-' && p.gender !== '-') 
          ? '<br><span style="font-size:9px;color:var(--text-muted);">' + p.age + ' / ' + p.gender + '</span>' 
          : '';
        return '<tr>' +
          '<td><strong>' + (p.number || (i + 1)) + '</strong></td>' +
          '<td>' + nameDisplay + detailDisplay + '</td>' +
          '<td>' + p.bookingStatus + '</td>' +
          '<td><span class="pnr-status-badge ' + badgeClass + '">' + statusLabel + '</span></td>' +
          '<td>' + (p.coach || '-') + '</td>' +
          '<td>' + (p.berth || '-') + '</td>' +
          '</tr>';
      }).join('');
      const trainSvg = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="14" rx="2"/><path d="M4 11h16"/><path d="M12 3v8"/><path d="M8 19l-2 3"/><path d="M16 19l2 3"/><circle cx="8" cy="15" r="1"/><circle cx="16" cy="15" r="1"/></svg>';
      const arrowSvg = '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';
      const usersSvg = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>';
      const listSvg = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>';
      const trackSvg = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>';
      
      container.innerHTML =
        '<div class="pnr-result-card pnr-reveal">' +
        '<div class="pnr-result-header">' +
        '<h3>' + trainSvg + ' Journey Details</h3>' +
        '<span class="pnr-number-display mono">PNR: ' + formatPNRString(pnr) + '</span>' +
        '</div>' +
        '<div class="pnr-journey-info">' +
        '<div class="pnr-train-row">' +
        '<div class="pnr-train-icon">' + trainSvg + '</div>' +
        '<div class="pnr-train-details">' +
        '<div class="name">' + data.train.name + '</div>' +
        '<div class="number">#' + data.train.number + ' &middot; ' + (data.class || data.classType) + ' Class &middot; ' + (data.quota || 'GN') + ' Quota</div>' +
        '</div>' +
        '<a href="/tracking?train=' + data.train.number + '" class="search-btn" style="width:auto;padding:8px 14px;font-size:11px;background:var(--primary);color:#fff;text-decoration:none;margin:0;">' + trackSvg + ' Track Live Train</a>' +
        '</div>' +
        '<div class="pnr-route-display">' +
        '<div class="pnr-route-station">' +
        '<span class="code">' + fromCode + '</span>' +
        '<span class="name">' + data.from.name + '</span>' +
        '</div>' +
        '<div class="pnr-route-line">' +
        '<span class="date">' + formatDate(journeyDate) + '</span>' +
        '<div class="line"></div>' +
        '<span class="class-info">' + arrowSvg + ' ' + (data.class || data.classType) + '</span>' +
        '</div>' +
        '<div class="pnr-route-station">' +
        '<span class="code">' + toCode + '</span>' +
        '<span class="name">' + data.to.name + '</span>' +
        '</div>' +
        '</div>' +
        chartBadge +
        '</div>' +
        '</div>' +
        '<div class="pnr-result-card pnr-reveal pnr-reveal-delay-1">' +
        '<div class="pnr-passengers">' +
        '<h4>' + usersSvg + ' Passenger Status (' + data.passengers.length + ')</h4>' +
        '<table class="pnr-passenger-table">' +
        '<thead><tr>' +
        '<th>#</th><th>Name / Age</th><th>Booking</th><th>Current</th><th>Coach</th><th>Berth</th>' +
        '</tr></thead>' +
        '<tbody>' + paxRows + '</tbody>' +
        '</table>' +
        '</div>' +
        '</div>' +
        '<div class="pnr-result-actions pnr-reveal pnr-reveal-delay-2" style="display:flex;gap:10px;">' +
        '<a href="/tracking?train=' + data.train.number + '" class="search-btn" style="text-decoration:none;flex:1;">' + trackSvg + ' Track Live Location</a>' +
        '<a href="/bookings" class="btn-download" style="text-decoration:none;flex:1;text-align:center;">' + listSvg + ' View All Bookings</a>' +
        '</div>';
      container.classList.add('show');
    }
    function formatPNRString(pnr) {
      const clean = pnr.replace(/\D/g, '');
      if (clean.length === 10) return clean.substring(0, 4) + ' ' + clean.substring(4, 7) + ' ' + clean.substring(7);
      if (clean.length === 11) return clean.substring(0, 4) + ' ' + clean.substring(4, 8) + ' ' + clean.substring(8);
      return pnr;
    }
    function trackAnother() {
      const input = document.getElementById('pnrInput');
      input.value = '';
      input.focus();
      document.getElementById('pnrResults').classList.remove('show');
      document.getElementById('pnrResults').innerHTML = '';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
</body>
</html>
