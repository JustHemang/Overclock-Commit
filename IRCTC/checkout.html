<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Checkout - IRCTC</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="assets/new_ui.css">
  <link rel="stylesheet" href="assets/new_ui.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
</head>
<body>
  <header class="header" id="mainHeader"></header>
  <div class="mobile-nav" id="mobileNav"></div>
  <main class="main">
    <div class="page-container-new">
      <div class="page-card" style="max-width: 900px; margin: 0 auto; text-align: center;">
        <h1 class="page-title">CHECKOUT</h1>
        <p class="page-subtitle">Complete your train booking</p>
        <div class="checkout-container" id="checkoutContent" style="box-shadow: none; border: none; background: transparent; text-align: left; margin-top: 30px;">
          <div class="loading-state">
            <div class="spinner"></div>
            <p>Loading booking details...</p>
          </div>
        </div>
      </div>
    </div>
  </main>
  <footer class="footer" id="mainFooter"></footer>
  <div class="toast-container" id="toastContainer"></div>
  <script src="data.js"></script>
  <script src="common.js"></script>
  <script src="api.js"></script>
  <script>
let currentTrain = null;
let currentClass = '2A';
let selectedSeats = [];
let passengerCount = 1;
let lastBooking = null;
let bookingDate = '';
document.addEventListener('DOMContentLoaded', () => {
  if (!requireLogin()) return;
  const trainData = localStorage.getItem('irctc_selected_train');
  currentClass = localStorage.getItem('irctc_selected_class') || '2A';
  selectedSeats = JSON.parse(localStorage.getItem('irctc_selected_seats') || '[]');
  passengerCount = parseInt(localStorage.getItem('irctc_passenger_count') || '1');
  const params = new URLSearchParams(window.location.search);
  bookingDate = params.get('date') || getTomorrowDate();
  if (!trainData) { window.location.href = '/'; return; }
  currentTrain = JSON.parse(trainData);
  const user = getCurrentUser();
  if (user) {
    const mobileInput = document.getElementById('mobileNumber');
    if (mobileInput) mobileInput.value = user.phone || '';
  }
  renderPassengerForms();
  updateSummary();
  document.getElementById('checkoutTotal').textContent = formatCurrency(getTotalFare());
  document.getElementById('passengerSection').style.display = 'block';
  document.getElementById('confirmationSection').style.display = 'none';
});
function getTotalFare() {
  if (!currentTrain || !currentTrain.classes || !currentTrain.classes[currentClass]) {
    return 450 * passengerCount;
  }
  const base = currentTrain.classes[currentClass].fare * passengerCount;
  const reservation = 40 * passengerCount;
  const gst = Math.round(base * 0.05);
  const food = 155 * passengerCount;
  return base + reservation + gst + food;
}
function updateSummary() {
  if (!currentTrain) return;
  document.getElementById('summaryFrom').textContent = currentTrain.from || '-';
  document.getElementById('summaryTo').textContent = currentTrain.to || '-';
  document.getElementById('summaryFromTime').textContent = currentTrain.depart || '-';
  document.getElementById('summaryToTime').textContent = currentTrain.arrive || '-';
  document.getElementById('summaryDuration').textContent = currentTrain.duration || '--:--';
  document.getElementById('summaryTrainName').textContent = `${currentTrain.name || 'Train'} (${currentTrain.number || ''})`;
  document.getElementById('summaryClass').textContent = currentClass;
  document.getElementById('summaryDate').textContent = formatDate(bookingDate);
  const classInfo = currentTrain.classes?.[currentClass] || { fare: 450 };
  const base = classInfo.fare * passengerCount;
  const res = 40 * passengerCount;
  const gst = Math.round(base * 0.05);
  const food = 155 * passengerCount;
  document.getElementById('summaryBaseFare').textContent = formatCurrency(base);
  document.getElementById('summaryReserve').textContent = formatCurrency(res);
  document.getElementById('summaryGst').textContent = formatCurrency(gst);
  document.getElementById('summaryCatering').textContent = formatCurrency(food);
  document.getElementById('summaryTotal').textContent = formatCurrency(base + res + gst + food);
}
function renderPassengerForms() {
  const container = document.getElementById('passengerForms');
  let html = '';
  for (let i = 0; i < passengerCount; i++) {
    html += `<div class="passenger-form" id="passengerForm${i}">
      <div class="passenger-form-header"><h4>Passenger ${i + 1} ${i === 0 ? '(Primary)' : ''}</h4></div>
      <div class="passenger-fields">
        <div class="input-wrapper"><i class="fas fa-user"></i><input type="text" placeholder="Full Name" class="p-name"></div>
        <div class="input-wrapper"><i class="fas fa-birthday-cake"></i><input type="number" placeholder="Age" min="1" max="125" class="p-age"></div>
        <div class="input-wrapper"><i class="fas fa-venus-mars"></i><select class="p-gender"><option value="">Gender</option><option value="M">Male</option><option value="F">Female</option><option value="O">Other</option></select></div>
        <div class="input-wrapper"><i class="fas fa-couch"></i><select class="p-berth"><option value="">No Preference</option><option value="LB">Lower Berth</option><option value="UB">Upper Berth</option><option value="SL">Side Lower</option><option value="SU">Side Upper</option></select></div>
      </div>
    </div>`;
  }
  container.innerHTML = html;
}
function selectPayment(type) {
  document.querySelectorAll('.payment-option').forEach(o => o.classList.remove('active'));
  event.target.closest('.payment-option').classList.add('active');
  ['upi', 'card', 'wallet', 'netbanking'].forEach(t => {
    const el = document.getElementById(t + 'Detail');
    if (el) el.style.display = t === type ? 'block' : 'none';
  });
}
function formatCardNumber(input) {
  let v = input.value.replace(/\D/g, '').substring(0, 16);
  input.value = v.replace(/(.{4})/g, '$1 ').trim();
}
function formatExpiry(input) {
  let v = input.value.replace(/\D/g, '').substring(0, 4);
  if (v.length >= 2) v = v.substring(0, 2) + '/' + v.substring(2);
  input.value = v;
}
async function processPayment() {
  const nameEl = document.querySelector('.p-name');
  if (nameEl && !nameEl.value.trim()) { showToast('Please fill in passenger details', 'error'); return; }
  const mobile = document.getElementById('mobileNumber');
  if (mobile && !mobile.value.trim()) { showToast('Please enter mobile number', 'error'); return; }
  const btn = document.querySelector('.btn-pay');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
  showLoading('Processing payment...');
  const passengers = [];
  document.querySelectorAll('.passenger-form').forEach(form => {
    passengers.push({
      name: form.querySelector('.p-name')?.value || 'Passenger',
      age: form.querySelector('.p-age')?.value || '25',
      gender: form.querySelector('.p-gender')?.value || 'M',
      seat: selectedSeats[passengers.length] || 'TBD'
    });
  });
  const classInfoPay = currentTrain.classes?.[currentClass] || { fare: 450 };
  const base = classInfoPay.fare * passengers.length;
  const res = 40 * passengers.length;
  const gst = Math.round(base * 0.05);
  const food = 155 * passengers.length;
  const total = base + res + gst + food;
  await new Promise(r => setTimeout(r, 2000));
  hideLoading();
  showLoading('Confirming booking...');
  const result = await createBooking({
    train: { number: currentTrain.number, name: currentTrain.name },
    from: currentTrain.from, to: currentTrain.to,
    date: bookingDate, classType: currentClass,
    depart: currentTrain.depart || '00:00',
    passengers, fare: total,
    paymentMethod: document.querySelector('.payment-option.active span')?.textContent || 'UPI'
  });
  hideLoading();
  if (!result.success) {
    btn.disabled = false;
    btn.innerHTML = `<i class="fas fa-lock"></i> Pay ${formatCurrency(total)}`;
    showToast(result.error || 'Booking failed', 'error');
    return;
  }
  const booking = result.booking;
  lastBooking = booking;
  document.getElementById('passengerSection').style.display = 'none';
  document.getElementById('confirmationSection').style.display = 'block';
  document.getElementById('pnrNumber').textContent = booking.pnr;
  document.querySelectorAll('.progress-step')[0].classList.add('done');
  document.querySelectorAll('.progress-step')[0].classList.remove('active');
  document.querySelectorAll('.progress-step')[1].classList.add('done');
  document.querySelectorAll('.progress-step')[1].classList.remove('active');
  document.querySelectorAll('.progress-step')[2].classList.add('active');
  document.getElementById('bookingSummary').innerHTML = `
    <div style="margin-bottom:10px;"><strong>${booking.train.name} (${booking.train.number})</strong><br>
    <span style="color:var(--text-secondary);font-size:12px;">${booking.from} → ${booking.to}</span><br>
    <span style="color:var(--text-secondary);font-size:12px;">Date: ${formatDate(booking.date)}</span></div>
    <table style="width:100%;font-size:12px;">
      <tr><th style="text-align:left;padding:4px 0;">Passenger</th><th>Seat</th><th>Status</th></tr>
      ${booking.passengers.map(p => `<tr><td style="padding:4px 0;">${p.name}</td><td style="text-align:center;">${booking.classType}/CNF</td><td style="text-align:center;"><span style="color:var(--success);font-weight:700;">CONFIRMED</span></td></tr>`).join('')}
    </table>
    <div style="border-top:1px solid var(--border);margin-top:8px;padding-top:8px;text-align:right;"><strong>Total Paid: ${formatCurrency(booking.fare)}</strong></div>
    <div style="font-size:10px;color:var(--text-muted);margin-top:5px;">Payment via: ${booking.paymentMethod} | Booking saved to your account</div>`;
  showToast('Booking Confirmed! PNR: ' + booking.pnr, 'success');
  localStorage.removeItem('irctc_selected_seats');
  localStorage.removeItem('irctc_passenger_count');
}
  </script>
</body>
</html>
